# ==============================================================================
# ReviewGround - Automated Dependency & Security Updates via GitHub Dependabot
# Keeps npm packages and GitHub Action versions secure with grouped PRs
# ==============================================================================
version: 2
updates:
  # 1. Automated npm dependencies updates (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    # Group updates together to prevent PR spam
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"

  # 2. Automated GitHub Actions versions updates (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "ci"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
