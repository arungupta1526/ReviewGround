name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Google Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Update Floating Major Tag (v1)
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ steps.release.outputs.tag_name }}';
            if (!tag) {
              console.log('No new release tag found; skipping floating tag update.');
              return;
            }
            const major = tag.split('.')[0];
            const sha = '${{ steps.release.outputs.sha }}' || context.sha;
            console.log(`Updating floating tag ${major} to point to ${tag} (${sha})`);

            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${major}`,
                sha: sha,
                force: true
              });
              console.log(`✅ Successfully updated floating tag ${major}`);
            } catch (err) {
              console.log(`Tag ref does not exist yet or failed update (${err.message}), creating fresh ref...`);
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${major}`,
                sha: sha
              });
              console.log(`✅ Successfully created floating tag ${major}`);
            }
