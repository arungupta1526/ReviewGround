name: CI & Self-Verification

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # Stage 1: Secret Leak Detection
  # =============================================================
  gitleaks:
    name: 🐍 1. Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================
  # Stage 2: Dependency Security Audit
  # =============================================================
  security-audit:
    name: 🐍 2. Dependency Audit
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

  # =============================================================
  # Stage 3: TypeScript Compilation & Bundle Verification
  # =============================================================
  build:
    name: 🐍 3. Build & Compilation
    needs: [security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Bundle
        run: npm run build

      - name: Verify Bundle Integrity
        run: test -f dist/index.js

  # =============================================================
  # Stage 4: Unit Tests & Invariant Verification
  # =============================================================
  test:
    name: 🐍 4. Unit Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # =============================================================
  # Stage 5: ReviewGround Self-Verification (Dogfooding)
  # =============================================================
  reviewground-self-verify:
    name: 🛡️ 5. ReviewGround Self-Verification
    needs: [gitleaks, security-audit, build, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ReviewGround Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: all
          enable-pr-description-update: 'true'
          enable-check-run: 'true'
          gitleaks-result: ${{ needs.gitleaks.result }}
          audit-result: ${{ needs.security-audit.result }}
          build-result: ${{ needs.build.result }}
          test-result: ${{ needs.test.result }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
