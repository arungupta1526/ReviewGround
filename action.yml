name: 'ReviewGround'
description: 'Universal AI Code Reviewer with 7-provider BYOK, live registry grounding, 1-click suggestions & sticky CI summaries.'
author: 'ReviewGround'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token with pull-requests:write permission for posting PR reviews and suggestions'
    required: false
    default: '${{ github.token }}'

  mode:
    description: 'Execution mode: "review" (AI review only), "summary" (Post-CI status only), "all" (both), "describe" (PR description & walkthrough only), or "slash-command" (handle @reviewground/@review PR comment commands via issue_comment event)'
    required: false
    default: 'all'

  provider:
    description: 'Preferred AI provider ("gemini", "openai", "anthropic", "groq", "deepseek", "custom"). Auto-detected if omitted.'
    required: false

  model:
    description: 'Custom model name override for selected provider'
    required: false

  fallback-models:
    description: 'Comma-separated custom fallback models (e.g. "gemini-3.1-flash-lite,gemini-flash-latest")'
    required: false

  gemini-api-key:
    description: 'Google Gemini API key (supports Gemini 2.5 Flash / Flash-Lite with Search Grounding)'
    required: false

  openai-api-key:
    description: 'OpenAI API key (supports GPT-4o / GPT-4o-mini)'
    required: false

  anthropic-api-key:
    description: 'Anthropic API key (supports Claude 3.5 Sonnet / Haiku)'
    required: false

  groq-api-key:
    description: 'Groq API key (supports Llama 3.3 70B / Qwen 3.8)'
    required: false

  deepseek-api-key:
    description: 'DeepSeek API key (supports DeepSeek V3 / R1)'
    required: false

  openrouter-api-key:
    description: 'OpenRouter API key (supports 200+ models including Qwen, Llama, Mistral)'
    required: false

  llm-base-url:
    description: 'Custom OpenAI-compatible base URL (e.g. http://localhost:11434/v1 for Ollama, or OpenRouter)'
    required: false

  llm-api-key:
    description: 'API key for custom endpoint (optional for local Ollama)'
    required: false

  enable-search-grounding:
    description: 'Enable Google Search tool grounding for Gemini (default true)'
    required: false
    default: 'true'

  enable-inline-suggestions:
    description: 'Post 1-click interactive commit suggestion buttons directly on code diffs (default true)'
    required: false
    default: 'true'

  enable-prune-inline-suggestions:
    description: 'Auto-delete / prune outdated previous ReviewGround inline suggestions on subsequent CI runs (default false)'
    required: false
    default: 'false'

  enable-npm-verify:
    description: 'Verify package updates against live npm registry to eliminate version hallucinations (default true)'
    required: false
    default: 'true'

  base-branch:
    description: 'Base branch to compare diff against (default main)'
    required: false
    default: 'main'

  temperature:
    description: 'LLM sampling temperature (0.0–1.0). Lower = more precise/deterministic, higher = more creative. Default: 0.2'
    required: false
    default: '0.2'

  max-tokens:
    description: 'Maximum output tokens for the AI review response. Default: 2048'
    required: false
    default: '2048'

  review-level:
    description: 'Review depth: "critical" (bugs & security only), "standard" (default — bugs, security, performance), "comprehensive" (all including style & docs)'
    required: false
    default: 'standard'

  ignore-patterns:
    description: 'Comma-separated glob patterns to exclude from AI review (e.g. "dist/**,*.min.js,src/migrations/**")'
    required: false

  comment-tag:
    description: 'HTML comment tag used to identify sticky PR comments'
    required: false
    default: '<!-- reviewground-code-review -->'

  pr-number:
    description: 'Pull Request number (auto-detected from workflow event if omitted)'
    required: false

  gitleaks-result:
    description: 'Outcome of Gitleaks stage (e.g. needs.gitleaks.result)'
    required: false

  audit-result:
    description: 'Outcome of dependency audit stage (e.g. needs.security-audit.result)'
    required: false

  build-result:
    description: 'Outcome of build stage (e.g. needs.build.result)'
    required: false

  test-result:
    description: 'Outcome of test stage (e.g. needs.test.result)'
    required: false

  run-id:
    description: 'GitHub Actions workflow run ID for duration calculation (defaults to GITHUB_RUN_ID)'
    required: false

  extra-stages:
    description: 'JSON array of extra CI stages to include in summary table (e.g. [{"name":"Deploy","result":"success"}])'
    required: false

  review-language:
    description: 'Language for the AI review output (e.g. en, ja, es, de, zh, pt, fr). Default: en (English)'
    required: false
    default: 'en'

  enable-pr-description-update:
    description: 'Auto-update PR body with AI-generated summary, changed areas checklist, walkthrough table, and risk badge (default false)'
    required: false
    default: 'false'

  generate-pr-description:
    description: 'Auto-generate PR description with summary, walkthrough table, and testing checklist (default false)'
    required: false
    default: 'false'

  enable-check-run:
    description: 'Create a GitHub Check Run with pass/fail gate based on critical issues found (requires checks:write permission, default false)'
    required: false
    default: 'false'

  enable-multi-registry-verify:
    description: 'Verify package changes against live NPM, PyPI, Crates.io, and Go module proxy registries to eliminate version hallucinations (default true)'
    required: false
    default: 'true'

  enable-cost-footer:
    description: 'Add token usage and estimated cost transparency footer to sticky review comment (default true)'
    required: false
    default: 'true'

  enable-smart-diff-priority:
    description: 'For large PRs, prioritize security-critical files (auth, API, DB) before lower-priority files (assets, lockfiles, snapshots) to maximize token budget efficiency (default true)'
    required: false
    default: 'true'

  enable-owasp-tagging:
    description: 'Instruct AI to tag all security findings with OWASP Top 10 category and CWE taxonomy IDs (default true)'
    required: false
    default: 'true'

  enable-test-coverage-check:
    description: 'Detect new exported functions/endpoints added without corresponding test files and suggest test stubs (default true)'
    required: false
    default: 'true'

  skip-on-ci-failure:
    description: 'Skip deep AI code review if CI build or test stages failed to prevent noise on broken code (default false)'
    required: false
    default: 'false'

outputs:
  reviewed:
    description: 'Whether an AI code review was generated ("true" or "false")'
  reviewer-engine:
    description: 'Name and model of the AI provider that generated the review'
  described:
    description: 'Whether an automated PR description and walkthrough was generated ("true" or "false")'
  summarized:
    description: 'Whether the CI pipeline summary was generated ("true" or "false")'
  summary-markdown:
    description: 'Rendered markdown table of CI pipeline results and durations'

runs:
  using: 'node24'
  main: 'dist/index.js'
